<!doctype html>
<html>
<head>
	<link rel="stylesheet" type="text/css" href="map.css" />
</head>
<body>
	<div class="navbar">
		<div class="navbar-container">
			<h1 class="navbar-title">
				<a class="navbar-link" href="https://github.com/sandgraham">@sandgraham</a>
				/
				<a href="https://github.com/sandgraham/random_maps">
					random_maps
				</a>
			</h1>
		</div>
	</div>

	<div id="content">
		<div class="content-container">
			<canvas id="mapCanvas"></canvas>
			<div id="side-bar">
				<div id="roughness" class="modifiers">
					<label class="modifier-text" for="roughness-input">
						roughness
					</label>
					<input id="roughness-input" type="number" size="3" placeholder="10" min="0" value="10">
				</div>
				<div id="altitude" class="modifiers">
					<label class="modifier-text" for="altitude">
						altitude
					</label>
					<input name="altitude" id="altitude-input" type="range" min="1" max="5" value="5">
				</div>
				<button type="button" id="create">
					Create Map
				</button>
			</div>
		</div>
	</div>

	<script type="module" src="src/main.js"></script>
</body>
</html>
